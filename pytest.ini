[pytest]
addopts =
    --html=reports/report.html
    --self-contained-html
    --reruns=2
    --reruns-delay=1
    -v

testpaths = tests

markers =
    smoke: quick sanity checks verifying framework wiring
    regression: full regression suite
    elements: DemoQA Elements section
    forms: DemoQA Forms section
    alerts: DemoQA Alerts, Frame & Windows section
    widgets: DemoQA Widgets section
    interactions: DemoQA Interactions section
    bookstore: DemoQA Book Store Application section
